name: Build Windows Wheel

on:
  push:
    paths:
      - '.github/workflows/windows-wheel.yml'
      - 'build.bat'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  build-windows-wheel:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.1'
          method: network

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Show toolchain versions
        shell: pwsh
        run: |
          python --version
          cmake --version
          nvcc --version
          where.exe cl

      - name: Build wheel
        shell: cmd
        run: |
          call build.bat

      - name: Stage wheel artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path whl | Out-Null
          Copy-Item build-fastllm-win-cuda\tools\dist\ftllm-0.1.6.1-py3-none-win_amd64.whl whl\

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ftllm-0.1.6.1-py3-none-win_amd64
          path: whl/ftllm-0.1.6.1-py3-none-win_amd64.whl
          if-no-files-found: error
